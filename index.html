(function () {
  var key = 'e4b-visit';
  var day = new Date(Date.now() + 7 * 3600000).toISOString().slice(0, 10);

  var source = (params.get('utm_source') || '').trim().toLowerCase().slice(0, 64);

    source = '';

      var host = new URL(document.referrer).hostname;
      if (host !== location.hostname) source = host.replace(/^www\./, '');
    }
  }
  if (!source) {
    if (params.has('fbclid')) source = 'facebook';
    else if (params.has('gclid')) source = 'google';
    else if (params.has('ttclid')) source = 'tiktok';
  }
  source = source || 'direct';
  for (var platform of ['facebook', 'tiktok', 'youtube', 'zalo', 'instagram', 'google']) {
    if (source === platform || source.split('.').includes(platform)) {
      source = platform;
      break;
    }
  }
  if (source === 'youtu.be') source = 'youtube';
  var visit;
  try { visit = JSON.parse(sessionStorage.getItem(key)); } catch (e) {}

    visit = { id: crypto.randomUUID(), day: day, source: source };

})();

<div class="card"><div class="num" style="font-size:18px">05</div><div style="font-size:23px;line-height:1.45;font-weight:600;color:#1A1230;text-wrap:pretty">Sinh viên, người sắp đi làm muốn <strong style="color:#5D0390;font-weight:900">phỏng vấn tự tin</strong>, có tiếng Anh để <strong style="color:#5D0390;font-weight:900">chọn việc tốt hơn, thu nhập cao hơn</strong>.</div></div>
<div class="card"><div class="num" style="font-size:18px">06</div><div style="font-size:23px;line-height:1.45;font-weight:600;color:#1A1230;text-wrap:pretty">Người đã thử nhiều app, nhiều khóa nhưng <strong style="color:#5D0390;font-weight:900">bỏ dở giữa chừng</strong> vì không có lộ trình rõ và <strong style="color:#5D0390;font-weight:900">không có thời gian</strong>.</div></div>
</div>
</div>

<section class="sec lav" id="cau-chuyen" style="padding:48px 0 64px">
<div class="wrap" style="max-width:960px">
<p class="eb">Câu chuyện người sáng lập</p>
<h2 class="h2" style="text-wrap:balance">Từ một vùng quê Nghệ An, tiếng Anh đã đưa mình đi xa hơn mình từng nghĩ</h2>
<div class="st-open"><figure style="margin:0;border-radius:18px;overflow:hidden;box-shadow:0 14px 34px rgba(93,3,144,.14)"><img src="assets/ed614dc54a7c042723f1fc038efb8578.jpg" alt="Cô Lucy tại văn phòng Lucina English Class" loading="lazy" style="display:block;width:100%;height:100%;object-fit:cover;object-position:center 70%;aspect-ratio:3/4"></figure><div style="background:#FFFFFF;border-left:5px solid #F7941D;border-radius:16px;padding:20px 22px;font-size:19px;line-height:1.65;font-style:italic;color:#3A2F52;align-self:center">Mình là Nhung Lucy (Cô Lucy Tiếng Anh Giao Tiếp). Mình lớn lên ở một vùng quê nghèo của Nghệ An. Hồi ấy, mình chưa biết tiếng Anh sẽ đưa mình đi đâu. Mình chỉ nhớ mỗi lần hiểu thêm một chữ, mình lại háo hức muốn học chữ tiếp theo. Và trong mình luôn mang một hoài bão: <strong style="color:#5D0390">Tiếng Anh sẽ thay đổi cuộc sống của mình!</strong></div></div>
<div style="display:flex;flex-direction:column;gap:14px;margin-top:24px;font-size:18px;line-height:1.75;color:#2E2640">
<h3 style="font-size:24px;line-height:1.3;font-weight:900;color:#5D0390;margin:8px 0 0">Mình cũng bắt đầu từ những điều nhỏ nhặt nhất, như bạn hôm nay</h3>
<p style="margin:0">Ngày còn ở quê, mình có ít cơ hội học tập và hiếm khi có người chỉ cho mình nên bắt đầu từ đâu, hay làm gì khi học mãi vẫn chưa hiểu. Vậy mà mình mê tiếng Anh. Gặp một từ mới, mình muốn đọc cho đúng, hiểu cho rõ, rồi thử dùng từ ấy để nói một điều của riêng mình. Có những câu mình đọc đi đọc lại. Đến khi hiểu ra, mình vui đến mức muốn học thêm ngay một chút nữa.</p>
<p style="margin:0">Mình cứ miệt mài như thế, với từng chữ mình có cơ hội được học. Rồi mình bước chân vào <strong>Đại học Ngoại thương</strong>. Sau này, mình làm việc tại các công ty toàn cầu, có cơ hội làm việc với nhiều chủ doanh nghiệp và nhiều lần được ghi nhận là <strong>MVP của tháng, của quý</strong>.</p>
<div class="sg"><div class="sg-l">Những năm đi làm tại công ty toàn cầu</div><div class="sg-g sg3"><figure class="sg-f sg-wide"><img src="assets/45b52be38dfe9087fc9e794830a9d788.jpg" alt="Họp nhóm kinh doanh tại công ty toàn cầu" loading="lazy" style="aspect-ratio:21/9;object-position:center 55%"><figcaption>Những buổi họp nhóm, trình bày số liệu bằng tiếng Anh ở công ty toàn cầu</figcaption></figure><figure class="sg-f"><img src="assets/534d48d4f5a83796d2d993ff9bba018a.jpg" alt="MVP of the Week · dự án D2C" loading="lazy" style="aspect-ratio:4/3;object-position:center"><figcaption>MVP of the Week · dự án D2C</figcaption></figure><figure class="sg-f"><img src="assets/6c4bde190610bb221e7f1b824c1a503d.jpg" alt="Nhân sự kinh doanh xuất sắc nhất dự án D2C" loading="lazy" style="aspect-ratio:4/3;object-position:center"><figcaption>Nhân sự kinh doanh xuất sắc nhất dự án D2C</figcaption></figure><figure class="sg-f"><img src="assets/b2830094d0662c0a5793b66b3a49fecc.jpg" alt="Khách mời sự kiện One Accesstrade · D2C Business Development Leader" loading="lazy" style="aspect-ratio:4/3;object-position:center 67%"><figcaption>Khách mời sự kiện One Accesstrade · D2C Business Development Leader</figcaption></figure><figure class="sg-f"><img src="assets/34b147b229760e28ea699e62c6e297c9.jpg" alt="Bằng khen tại Year End Party" loading="lazy" style="aspect-ratio:4/3;object-position:center 35%"><figcaption>Bằng khen tại Year End Party</figcaption></figure><figure class="sg-f"><img src="assets/80bf575b8ff3bb6fb4ed4bd7c82b3645.jpg" alt="Lễ ký kết đối tác truyền thông & kinh doanh chiến lược" loading="lazy" style="aspect-ratio:4/3;object-position:center"><figcaption>Lễ ký kết đối tác truyền thông & kinh doanh chiến lược</figcaption></figure><figure class="sg-f"><img src="assets/e465f67455cbf2ae3188041526cd01b7.jpg" alt="Gặp gỡ đối tác chủ doanh nghiệp" loading="lazy" style="aspect-ratio:4/3;object-position:center"><figcaption>Gặp gỡ đối tác chủ doanh nghiệp</figcaption></figure></div></div>
<p style="margin:0">Trong những năm đi làm, mình mới thấy những chữ mình từng say mê học ở quê đã theo mình đi xa đến thế nào. Mình dùng tiếng Anh để đặt câu hỏi, để trình bày ý tưởng và để làm việc cùng những người mà cô gái ngày ấy chưa từng nghĩ mình sẽ có dịp gặp.</p>
<div class="sg"><div class="sg-l">Tiếng Anh đưa mình đi xa hơn mình từng nghĩ</div><div class="sg-g sg4"><figure class="sg-f"><img src="assets/b2fe8df3d84882d78df94d78b13625eb.jpg" alt="Kuala Lumpur, Malaysia" loading="lazy" style="aspect-ratio:3/4;object-position:center 60%"><figcaption>Kuala Lumpur, Malaysia</figcaption></figure><figure class="sg-f"><img src="assets/1cd59f8d4eb652c7b4f71d24fcca8e38.jpg" alt="Batu Caves, Malaysia" loading="lazy" style="aspect-ratio:3/4;object-position:center 75%"><figcaption>Batu Caves, Malaysia</figcaption></figure><figure class="sg-f"><img src="assets/3109cd0f173e9ebb721ceacdec98abf5.jpg" alt="Halloween cùng các Giáo sư Đại học VinUni" loading="lazy" style="aspect-ratio:3/4;object-position:center"><figcaption>Halloween cùng các Giáo sư Đại học VinUni</figcaption></figure><figure class="sg-f"><img src="assets/3e452028be7d69bc5f5ca4ebb40a8cd9.jpg" alt="Những buổi trò chuyện cùng đối tác nước ngoài" loading="lazy" style="aspect-ratio:3/4;object-position:center"><figcaption>Những buổi trò chuyện cùng đối tác nước ngoài</figcaption></figure></div></div>
<h3 style="font-size:24px;line-height:1.3;font-weight:900;color:#5D0390;margin:12px 0 0">Mình muốn việc học có một chỗ trong cuộc sống bạn đang có, mà không làm mất đi nhịp sống của bạn</h3>
<p style="margin:0">Có thể bạn đã từng gặp những khoảnh khắc như thế này. Đi du lịch, bạn hỏi đường, người ta trả lời nhanh quá, bạn chỉ kịp <strong>mỉm cười gật đầu</strong> dù vẫn chưa biết phải rẽ ở đâu. Vào nhà hàng, bạn chỉ tay vào ảnh món ăn vì <strong>sợ nói sai</strong>. Con hỏi một câu tiếng Anh trong sách, bạn lúng túng chưa biết giải thích thế nào.</p>
<p style="margin:0">Ở công ty, sếp hay đối tác nước ngoài hỏi một câu, bạn hiểu ý nhưng <strong>câu trả lời không bật ra được</strong>. Một email ngắn cũng mất cả buổi để viết. Trong cuộc họp, bạn có ý muốn góp, nhưng đến lúc nghĩ ra cách nói thì mọi người đã chuyển sang chuyện khác. Rồi có một cơ hội thăng tiến, một chuyến công tác, một công việc tốt hơn đòi hỏi tiếng Anh, và bạn <strong>lặng lẽ lùi lại</strong>.</p>
<p style="margin:0">Tối về, bạn mở một bài tiếng Anh. Nghe được vài phút, bạn nhận ra mình đã quá mệt để tập trung. Bạn tự nhủ mai sẽ học. Rồi ngày mai cũng kín lịch như hôm nay. Không phải vì bạn lười. Chỉ là bạn chưa có một cách học <strong>vừa với một ngày đã kín lịch</strong>.</p>
<p style="margin:0">Khi nghĩ về một lớp tiếng Anh cho người bận rộn, mình nghĩ đến những ngày như thế. Mình muốn bạn được học từ những tình huống bạn thật sự gặp, như hỏi lại khi nghe chưa rõ hay góp một ý kiến trong cuộc họp. Mình cũng muốn bạn có một lộ trình đủ rõ để dù công việc cuốn đi vài ngày, khi quay lại, bạn vẫn biết có thể học tiếp từ đâu.</p>
<p style="margin:0">Đó là lý do mình sáng lập và trực tiếp phụ trách chuyên môn tại <strong>Lucina English Class</strong>, chuỗi lớp tiếng Anh online dành cho người bận rộn.</p>
<div class="sg"><div class="sg-l">Lucina English Class hôm nay</div><div class="sg-g sg4"><figure class="sg-f sg-wide"><img src="assets/3388b767042842f265a9c76d260fb0c0.jpg" alt="Lễ trao chứng nhận cuối khóa" loading="lazy" style="aspect-ratio:21/9;object-position:center 70%"><figcaption>Lễ trao chứng nhận cuối khóa cùng học viên</figcaption></figure><figure class="sg-f sg-wide"><img src="assets/ecb2bd9db28ddc3d2e6b8031ea93ebb9.jpg" alt="Đội ngũ Lucina English Class" loading="lazy" style="aspect-ratio:1594/876"><figcaption>Đội ngũ Lucina English Class</figcaption></figure><figure class="sg-f"><img src="assets/fca9afc6a48652177976d1bcf2a3b981.jpg" alt="Các buổi giao lưu tiếng Anh online của Lucina English Class" loading="lazy" style="aspect-ratio:16/10;object-position:center"><figcaption>Các buổi giao lưu tiếng Anh online cùng giáo viên bản xứ và quốc tế của Lucina English Class</figcaption></figure><figure class="sg-f"><img src="assets/29b54460439967a48f5414e7d75d70c9.jpg" alt="Gặp gỡ bạn bè quốc tế" loading="lazy" style="aspect-ratio:16/10;object-position:center 40%"><figcaption>Gặp gỡ bạn bè quốc tế</figcaption></figure><figure class="sg-f"><img src="assets/7dc267febe31b8b75969b8680ab57d54.jpg" alt="Từ bạn bè trở thành người đồng hành trong công việc" loading="lazy" style="aspect-ratio:16/10;object-position:center"><figcaption>Từ bạn bè trở thành người đồng hành trong công việc</figcaption></figure><figure class="sg-f"><img src="assets/9cb209fdd4d0ca2b1c5b2f44c87a9104.jpg" alt="Văn phòng của LEC tại Hà Nội" loading="lazy" style="aspect-ratio:16/10;object-position:center 60%"><figcaption>Văn phòng của LEC tại Hà Nội</figcaption></figure></div></div>
<h3 style="font-size:24px;line-height:1.4;font-weight:900;color:#5D0390;margin:12px 0 0">E4B ra đời từ mong muốn giúp bạn học được, rồi dùng được tiếng Anh trong cuộc sống của mình.</h3>
<p style="margin:0">Khi xây dựng E4B, mình nghĩ nhiều đến bạn sau một ngày làm việc. Công việc, gia đình, con cái… việc nào cũng cần thời gian. Bạn vẫn muốn học tiếng Anh, nhưng mở một bài giảng lên rồi lại tự hỏi: “Mình nên học gì trước? Học xong thì luyện thế nào để lúc cần có thể nói ra?”</p>
<p style="margin:0">Mình muốn E4B giúp bạn trả lời những câu hỏi ấy. Từng bài học được sắp xếp có chủ đích, từ cách phát âm, nghe rõ một câu đến tự nói được điều mình muốn. Cô hướng dẫn kỹ, bạn có phần thực hành để làm ngay, có lời giải để hiểu chỗ sai và có đội ngũ để hỏi khi còn vướng. Dù hôm nay chỉ dành được một khoảng thời gian ngắn, bạn vẫn biết mình đang học gì và bước tiếp theo là gì.</p>
<p style="margin:0">Điều mình mong là những gì bạn học sẽ theo bạn ra khỏi màn hình. Ai đó nói hơi nhanh, bạn vẫn hiểu. Lần đi du lịch tới, bạn có thể hỏi thêm về món ăn mình muốn gọi. Khi con hỏi một câu tiếng Anh, bạn cùng con tìm hiểu mà thấy tự tin hơn. Trong công việc, bạn có thể trao đổi rõ một yêu cầu, viết một email bớt ngập ngừng, hay góp ý kiến trong cuộc họp ngay lúc cần nói.</p>
<p style="margin:0">Mỗi lần làm được một việc như thế, bạn có thêm một lý do để tiếp tục. Tiếng Anh dần trở thành điều bạn sử dụng trong ngày, và những cơ hội trước đây bạn còn ngại cũng trở nên gần hơn.</p>

<!-- PROBLEMS -->
<section class="sec warm">
<div class="wrap">
<div class="hd">
<div><p class="eb">Có phải bạn cũng vậy?</p><h2 class="h2">“Mình học rồi mà.<span class="l2">Sao lúc cần vẫn không nói được?”</span></h2></div>
<p class="hd-lead">Câu trả lời có sẵn trong đầu, nhưng cứ mắc lại trước khi thành lời. Bạn không thiếu kiến thức, bạn thiếu <strong style="color:#5D0390;font-weight:800;background:linear-gradient(transparent 62%,#FFD3A1 62%)">một lộ trình nói theo tình huống</strong> và <strong style="color:#5D0390;font-weight:800;background:linear-gradient(transparent 62%,#FFD3A1 62%)">thói quen luyện đều mỗi ngày</strong>.</p>
</div>
<div class="grid g4">
<div class="card"><div class="ct">Học ngữ pháp nhiều năm nhưng rất sợ khi phải nói</div><div class="sm"><strong class="p">E4B giúp bạn:</strong> mỗi bài gắn với một tình huống thật và một <span class="hk">cấu trúc câu dùng được ngay</span>. <span class="hk">Ngữ pháp đi kèm tình huống</span>, không học rời.</div></div>
<div class="card"><div class="ct">Nghe không kịp khi người nước ngoài nói nhanh</div><div class="sm"><strong class="p">E4B giúp bạn:</strong> Chặng 0 dạy phát âm và giúp bạn nắm hết các tips phát âm (trọng âm, nối âm, ngắt nghỉ, ngữ điệu) <span class="hk">chỉ ngay sau 4 bài!</span> Bạn được tiếp cận <span class="hk">phương pháp nghe chủ động</span> để biết cách luyện nghe mỗi ngày.</div></div>
<div class="card"><div class="ct">Phát âm sai mà không biết sai ở đâu</div><div class="sm"><strong class="p">E4B giúp bạn:</strong> Cô Lucy chỉ rõ <span class="hk">lỗi người Việt hay mắc</span> trong từng bài. <span class="hk">Mỗi âm có video khẩu hình</span>, mỗi từ có audio giọng nam và giọng nữ để bạn nghe, nói theo và tự so sánh.</div></div>
<div class="card"><div class="ct">Xem video xong là thôi, không luyện</div><div class="sm"><strong class="p">E4B giúp bạn:</strong> mỗi bài có một trang <span class="hk">web thực hành siêu tương tác</span> đính kèm: ôn bài, luyện nghe và <span class="hk">bài tập chấm điểm ngay</span>, sai câu nào xem giải thích câu đó.</div></div>
<div class="card"><div class="ct">Học xong là quên</div><div class="sm"><strong class="p">E4B giúp bạn:</strong> mỗi chặng có <span class="hk">2 bài ôn nhanh, 1 bài kiểm tra giữa chặng và 1 bài kiểm tra cuối chặng</span>. Bài tập sau mỗi bài học.</div></div>
<div class="card"><div class="ct">Mất gốc, sợ không theo kịp</div><div class="sm"><strong class="p">E4B giúp bạn:</strong> <span class="hk">bộ video Pre-A1 miễn phí</span> dạy lại từ bảng chữ cái, số đếm, đại từ, to be. Học chậm thì xem lại, không ai giục.</div></div>
<div class="card"><div class="ct">Lịch làm việc thất thường, không theo được lớp cố định</div><div class="sm"><strong class="p">E4B giúp bạn:</strong> <span class="hk">không có giờ vào lớp</span>. Bạn học sáng sớm, giờ nghỉ trưa hay tối muộn đều được, nhịp gợi ý 3 bài mỗi tuần.</div></div>
<div class="card"><div class="ct">Sợ tự học không tiến bộ</div><div class="sm"><strong class="p">E4B giúp bạn:</strong> <span class="hk">hơn 1.000 học viên tự học đã thành công</span>. Lộ trình Cô Lucy thiết kế đã xếp sẵn từ dễ đến khó, học xong chặng này mới mở chặng sau. Mỗi bài được Cô Lucy hướng dẫn chi tiết: <span class="hk">dạy kỹ, học hiểu</span>. Có bài tập chấm điểm, mỗi chặng có bài ôn nhanh và bài kiểm tra giữa, cuối chặng, nên bạn <span class="hk">luôn thấy rõ mình đã tiến bộ tới đâu</span>.</div></div>
</div>
<div style="margin-top:18px;background:#5D0390;border-radius:20px;padding:24px 26px;display:flex;flex-wrap:wrap;gap:18px;align-items:center;justify-content:space-between"><div style="flex:1 1 360px;min-width:0;font-size:22px;line-height:1.35;font-weight:800;color:#FFFFFF">Gặp từ 2 vấn đề trở lên? <span style="color:#FFC27A">E4B thực sự dành cho bạn!</span> Chặng 0 là điểm bắt đầu cho bạn.</div><a href="#dang-ky" class="btn btn-o">Bắt đầu ngay cùng E4B</a></div>
</div>
</section>

<!-- ALAS -->
<section class="sec" id="alas">
<div class="wrap">
<div class="hd" style="flex-direction:column;align-items:stretch;gap:16px">
<div style="flex:none;min-width:0"><p class="eb">Bước ngoặt trong cách học</p><h2 class="h2">3 thay đổi nhỏ giúp bạn<span class="l2" style="white-space:normal">từ <span style="color:#F7941D">không biết</span> thành <span style="color:#F7941D">biết</span>, từ <span style="color:#F7941D">biết</span> thành <span style="color:#F7941D">nói được</span>.</span></h2></div>
<p class="hd-lead" style="flex:none;max-width:none;margin-left:0;font-size:19px">Phần lớn người học không thiếu kiến thức. Điều còn thiếu là cách biến những gì đã học thành phản xạ. Cô Lucy gói 3 thay đổi này thành một phương pháp riêng, dùng xuyên suốt mọi bài trong E4B.</p>
</div>
<div class="grid g3">
<div class="card" style="display:flex;flex-direction:column;gap:10px"><div class="num" style="margin:0">01</div><div class="ct" style="font-size:25px">Nghe bằng toàn bộ sự chú ý</div><div class="sm" style="font-size:18px;line-height:1.55"><span style="font-weight:800;color:#8A80A0">Thay vì:</span> bật bài nghe cho có, nghe xong không đọng lại gì.</div><div class="sm" style="font-size:18px;line-height:1.55"><span class="p" style="font-weight:800">Giờ là:</span> nghe để hiểu và biết cách bắt trọng âm, ngữ điệu, cách nối âm và nuốt âm của người bản xứ.</div></div>
<div class="card" style="display:flex;flex-direction:column;gap:10px"><div class="num" style="margin:0">02</div><div class="ct" style="font-size:25px">Học từ thành cụm, dùng được ngay</div><div class="sm" style="font-size:18px;line-height:1.55"><span style="font-weight:800;color:#8A80A0">Thay vì:</span> học từng từ rời rồi loay hoay ghép thành câu khi cần nói.</div><div class="sm" style="font-size:18px;line-height:1.55"><span class="p" style="font-weight:800">Giờ là:</span> nhớ cả cụm như <em>“Could you say that again?”</em>, cần là bật ra ngay.</div></div>
<div class="card" style="display:flex;flex-direction:column;gap:10px"><div class="num" style="margin:0">03</div><div class="ct" style="font-size:25px">Nghe xong là nói ngay</div><div class="sm" style="font-size:18px;line-height:1.55"><span style="font-weight:800;color:#8A80A0">Thay vì:</span> đợi dịch từ tiếng Việt sang rồi mới dám mở miệng.</div><div class="sm" style="font-size:18px;line-height:1.55"><span class="p" style="font-weight:800">Giờ là:</span> nhại lại, kể lại được rồi nói về chính mình bằng các câu vừa nghe.</div></div>
</div>
<div style="margin-top:28px;background:linear-gradient(140deg,#6A0AA3 0%,#5D0390 55%,#3E0263 100%);color:#FFFFFF;border-radius:26px;padding:34px 30px">
<div style="font-size:13px;font-weight:900;letter-spacing:.12em;color:#FFC27A">PHƯƠNG PHÁP ĐỘC QUYỀN CỦA CÔ LUCY VÀ LUCINA ENGLISH CLASS</div>
<div style="font-size:40px;line-height:1.1;font-weight:900;margin-top:8px">ALAS</div>
<div style="font-size:clamp(19px,2.2vw,24px);line-height:1.35;font-weight:900;margin-top:10px;text-wrap:balance">KHÔNG ĐƠN GIẢN LÀ HỌC, MÀ LÀ <span style="color:#FFC27A">HỌC CHUẨN PHƯƠNG PHÁP HIỆU QUẢ!</span></div><div style="font-size:16px;font-weight:700;color:#E2D5EF;margin-top:4px">Đã được chứng minh trên hơn 1.000 học viên thành công</div>
<div style="font-size:21px;font-weight:800;color:#F1E6FA;margin-top:4px">Active Listening &amp; Active Speaking · Nghe chủ động, nói chủ động</div>
<div style="font-size:16px;line-height:1.6;color:#E2D5EF;margin-top:10px;max-width:760px">Đã được ứng dụng cho hơn 1.000 học viên của Lucina English Class. Khác với lối học thụ động, ALAS đặt bạn vào trạng thái chủ động ở cả đầu vào lẫn đầu ra.</div>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px;margin-top:24px">
<div style="background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:18px;padding:20px">
<div style="font-size:12px;font-weight:900;letter-spacing:.08em;color:#FFC27A">ĐẦU VÀO</div>
<div style="font-size:22px;font-weight:900;margin-top:4px">Active Listening · Nghe chủ động</div>
<div style="display:flex;flex-direction:column;gap:8px;margin-top:12px"><div class="li" style="font-size:16px;line-height:1.5;color:#F1E6FA"><svg class="tick" viewBox="0 0 24 24" fill="none" stroke="#FFC27A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg><span>Nghe hiểu bằng toàn bộ sự chú ý, bắt trọng âm và ngữ điệu câu</span></div><div class="li" style="font-size:16px;line-height:1.5;color:#F1E6FA"><svg class="tick" viewBox="0 0 24 24" fill="none" stroke="#FFC27A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg><span>Nhận ra nối âm, nuốt âm, thứ tạo nên “ngữ điệu bản xứ”</span></div><div class="li" style="font-size:16px;line-height:1.5;color:#F1E6FA"><svg class="tick" viewBox="0 0 24 24" fill="none" stroke="#FFC27A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg><span>Ghi nhớ cụm từ nguyên khối thay vì từng từ rời</span></div></div>
<div style="margin-top:12px;font-size:15px;font-weight:700;color:#FFC27A">Kết quả: tai quen âm thanh có nghĩa, não lưu cả khối ngôn ngữ.</div>
</div>
<div style="background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:18px;padding:20px">
<div style="font-size:12px;font-weight:900;letter-spacing:.08em;color:#FFC27A">ĐẦU RA</div>
<div style="font-size:22px;font-weight:900;margin-top:4px">Active Speaking · Nói chủ động</div>
<div style="display:flex;flex-direction:column;gap:8px;margin-top:12px"><div class="li" style="font-size:16px;line-height:1.5;color:#F1E6FA"><svg class="tick" viewBox="0 0 24 24" fill="none" stroke="#FFC27A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg><span>Nghe hiểu xong là bật lại ngay: nhại theo, kể lại hoặc đáp ngắn</span></div><div class="li" style="font-size:16px;line-height:1.5;color:#F1E6FA"><svg class="tick" viewBox="0 0 24 24" fill="none" stroke="#FFC27A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg><span>Dùng lại chính cụm từ vừa nghe, không đợi dịch từ tiếng Việt</span></div><div class="li" style="font-size:16px;line-height:1.5;color:#F1E6FA"><svg class="tick" viewBox="0 0 24 24" fill="none" stroke="#FFC27A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg><span>Lặp đi lặp lại để nghe gì là có sẵn mẫu câu để nói</span></div></div>
<div style="margin-top:12px;font-size:15px;font-weight:700;color:#FFC27A">Kết quả: nói tự nhiên, nhanh và tự tin hơn, bớt ngập ngừng.</div>
</div>
</div>
<div style="font-size:15px;font-weight:900;letter-spacing:.06em;color:#FFC27A;margin-top:28px">4 BƯỚC ALAS TRONG MỖI BÀI E4B</div>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px;margin-top:12px">
<div style="background:#FFFFFF;color:#1A1230;border-radius:16px;padding:16px"><div style="font-size:30px;font-weight:900;color:#F7941D;line-height:1">1</div><div style="font-size:18px;font-weight:900;margin-top:6px">Nghe hiểu</div><div style="font-size:13px;font-weight:700;color:#8A80A0">Input · Comprehend</div><div style="font-size:15px;line-height:1.5;color:#4A4260;margin-top:6px">Nghe Cô Lucy giảng tình huống, từ vựng và câu mẫu cho đến khi hiểu rõ.</div></div>
<div style="background:#FFFFFF;color:#1A1230;border-radius:16px;padding:16px"><div style="font-size:30px;font-weight:900;color:#F7941D;line-height:1">2</div><div style="font-size:18px;font-weight:900;margin-top:6px">Bắt chước</div><div style="font-size:13px;font-weight:700;color:#8A80A0">Shadow · Repeat</div><div style="font-size:15px;line-height:1.5;color:#4A4260;margin-top:6px">Dừng video, nói theo từng câu, nhại đúng nhấn nhá và ngữ điệu.</div></div>
<div style="background:#FFFFFF;color:#1A1230;border-radius:16px;padding:16px"><div style="font-size:30px;font-weight:900;color:#F7941D;line-height:1">3</div><div style="font-size:18px;font-weight:900;margin-top:6px">Tái tạo</div><div style="font-size:13px;font-weight:700;color:#8A80A0">Retell · Reconstruct</div><div style="font-size:15px;line-height:1.5;color:#4A4260;margin-top:6px">Tự nói lại câu, ghép lại hội thoại mà không nhìn chữ.</div></div>
<div style="background:#FFFFFF;color:#1A1230;border-radius:16px;padding:16px"><div style="font-size:30px;font-weight:900;color:#F7941D;line-height:1">4</div><div style="font-size:18px;font-weight:900;margin-top:6px">Cá nhân hóa</div><div style="font-size:13px;font-weight:700;color:#8A80A0">Personalize · Apply</div><div style="font-size:15px;line-height:1.5;color:#4A4260;margin-top:6px">Dùng câu vừa học để nói về cuộc sống, công việc của chính bạn.</div></div>
</div>
<div style="font-size:15px;line-height:1.6;color:#E2D5EF;margin-top:22px;max-width:820px">ALAS không phải đường tắt và không biến bạn thành “thần đồng” sau một đêm. Nhưng nó cho bạn chiếc chìa khóa để mỗi ngày tiến thêm một bước, cho đến khi tiếng Anh thành phản xạ tự nhiên.</div>
</div>

<div class="wrap">
<div class="hd" style="flex-direction:column;align-items:stretch;gap:16px">
<div style="flex:none;min-width:0"><p class="eb">Sự thay đổi khi học cùng E4B</p><h2 class="h2">Từ học nhiều mà ngại nói,<span class="l2" style="white-space:normal">đến tự tin dùng tiếng Anh mỗi ngày.</span></h2></div>

<div class="ba">

ground:#F6F3F9;border-radius:14px;padding:14px 16px;display:flex;gap:10px;align-items:flex-start;font-size:16px;line-height:1.55;color:#5A5270"><svg class="tick" viewBox="0 0 24 24" fill="none" stroke="#B8AFC6" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"></path></svg><span>Bận vài hôm là bỏ, quay lại không biết học tiếp từ đâu.</span></div><div class="ba-c" style="background:#FFFFFF;border:1px solid #E6D6F6;border-radius:14px;padding:14px 16px;display:flex;gap:10px;align-items:flex-start;font-size:16px;line-height:1.55;color:#1A1230;font-weight:600"><svg class="tick" viewBox="0 0 24 24" fill="none" stroke="#F7941D" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg><span>Lộ trình 5 chặng rõ ràng, 15–20 phút mỗi ngày, video xem vô thời hạn nên luôn biết bài tiếp theo.</span></div></div><div style="display:contents"><div class="ba-c" style="background:#F6F3F9;border-radius:14px;padding:14px 16px;display:flex;gap:10px;align-items:flex-start;font-size:16px;line-height:1.55;color:#5A5270"><svg class="tick" viewBox="0 0 24 24" fill="none" stroke="#B8AFC6" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"></path></svg><span>Học lan man, không biết mình đang ở trình độ nào.</span></div><div class="ba-c" style="background:#FFFFFF;border:1px solid #E6D6F6;border-radius:14px;padding:14px 16px;display:flex;gap:10px;align-items:flex-start;font-size:16px;line-height:1.55;color:#1A1230;font-weight:600"><svg class="tick" viewBox="0 0 24 24" fill="none" stroke="#F7941D" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg><span>Kiểm tra đầu vào để chọn đúng chặng, mỗi chặng có đầu ra cụ thể và chứng nhận khi hoàn thành.</span></div></div>

<section id="gia-tri-e4b" class="sec value-section"><div class="wrap"><div class="decision-heading"><p class="eb">Điều gì làm nên giá trị của E4B?</p><h2 class="h2">Bạn có một chương trình chính khóa.<span class="l2" style="white-space:normal">Có hệ thống. Có thực hành. Có đồng hành.</span></h2><p>Những video chia sẻ trên kênh giúp bạn làm quen cách dạy của Cô Lucy. Trong E4B, bạn được học một chương trình được xây dựng theo chặng, có nhiệm vụ luyện tập và hỗ trợ để áp dụng kiến thức.</p></div><div class="value-grid"><article><span>01 · LỘ TRÌNH RÕ RÀNG</span><h3>Biết mình đang học gì và đi tới đâu</h3><p>140 bài học qua Chặng 0–4: từ phát âm, nghe–nói cơ bản đến giao tiếp đời sống, công việc và trình bày thuyết phục. Các chặng nối tiếp trong một chương trình.</p></article><article><span>02 · CÔ LUCY HƯỚNG DẪN</span><h3>Học kỹ cách làm, không chỉ xem lời giải</h3><p>Cô giải thích kiến thức, hướng dẫn cách luyện, chỉ ra lỗi thường gặp và đưa ví dụ vận dụng. Phương pháp ALAS xuyên suốt giúp bạn luyện nghe chủ động, nói chủ động.</p></article><article><span>03 · WEB THỰC HÀNH</span><h3>Học đến đâu, luyện ngay đến đó</h3><p>Web thực hành siêu tương tác cho từng bài: ôn kiến thức, luyện nghe, bài tập có chấm điểm và chữa bài chi tiết theo nội dung. Bạn biết phần nào cần làm lại.</p></article><article><span>04 · NHÓM ZALO 12 THÁNG</span><h3>Học vướng, có nơi để hỏi</h3><p>Đội ngũ Lucina English Class giải đáp, nhận xét và hướng dẫn cải thiện trong phạm vi chương trình qua tin nhắn hoặc tin nhắn thoại. Không bao gồm Meet hay lớp kèm 1–1.</p></article><article><span>05 · ÔN VÀ KIỂM TRA</span><h3>Nhận ra phần đã hiểu và phần cần luyện</h3><p>Chặng 1–4 có 8 bài ôn và 8 bài kiểm tra tổng cộng, cùng chứng nhận hoàn thành từng chặng. Bài kiểm tra giúp bạn điều chỉnh việc học, không chỉ đếm số video đã xem.</p></article><article><span>06 · HỌC THEO NHỊP CỦA BẠN</span><h3>Mua một lần, quay lại ôn khi cần</h3><p>Video xem vô thời hạn. Khi bận, bạn có thể tạm dừng rồi tiếp tục; khi cần, quay lại luyện tình huống sắp dùng trong đời sống hoặc công việc.</p></article></div><div class="course-distinction"><strong>Học phí dành cho toàn chương trình chính khóa A0–B2 và các quyền lợi kèm theo.</strong><p>Video Pre-A1 được chia sẻ miễn phí trên fanpage Cô Lucy E4B. Khi mua trọn lộ trình, bạn có thêm web ôn bài, thực hành, kiểm tra và games kèm chấm điểm, chữa bài chi tiết cho các bài Pre-A1, cùng toàn bộ chương trình chính khóa A0–B2.</p></div></div></section>
