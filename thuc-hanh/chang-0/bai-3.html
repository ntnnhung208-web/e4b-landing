/* ---------- STATE / ROUTING ---------- */
const ONLY='l3';LESSONS.splice(0,LESSONS.length,...LESSONS.filter(l=>l.id===ONLY));
const $=id=>document.getElementById(id), V=$('V');
let L=LESSONS[0], tab='nghe';
LESSONS.forEach(l=>{const b=document.createElement('button');b.textContent=l.name+' · '+l.topic;b.dataset.id=l.id;b.onclick=()=>go(l.id,l.full?tab:'nghe');$('LS').appendChild(b)});
document.querySelectorAll('#TB button').forEach(b=>b.onclick=()=>go(L.id,b.dataset.t));
function go(id,t){location.hash=id+(t==='nghe'?'':'-'+t)}
function route(){const h=(location.hash||'').slice(1);const [id,t]=h.split('-');L=LESSONS[0];tab=L.full?(!h?'on':(t==='on'||t==='bt'?t:'nghe')):'nghe';render()}
function setVoice(v){voice=v;st.set('voice',v);$('vf').setAttribute('aria-pressed',v==='f');$('vm').setAttribute('aria-pressed',v==='m');if(tab==='nghe')render()}
$('vf').onclick=()=>setVoice('f');$('vm').onclick=()=>setVoice('m');setVoice(voice);
document.addEventListener('click',e=>{const b=e.target.closest('[data-say]');if(b)say(b.dataset.say)});

function render(){
 document.querySelectorAll('#LS button').forEach(b=>b.classList.toggle('on',b.dataset.id===L.id));
 document.querySelectorAll('#TB button').forEach(b=>{b.setAttribute('aria-selected',b.dataset.t===tab);b.hidden=!L.full&&b.dataset.t!=='nghe'});
 $('tag').textContent='E4B · CHẶNG 0 · '+L.name.toUpperCase();
 $('h1').textContent=L.topic;
 sfx.pause(); if(window.LA){LA.pause()}
 V.innerHTML='';
 if(tab==='on')renderReview(); else if(tab==='bt')renderQuiz(); else renderListen();
}

/* ---------- ÔN BÀI ---------- */
function renderReview(){
 const sndCard=(s,long)=>`<div class="snd ${long?'long':'short'}"><span class="lab">${long?'DÀI':'NGẮN'}</span><span class="sym">${s[0]}</span>
  <video class="vid" data-src="v/${s[1]}.mp4" controls controlslist="nodownload noremoteplayback" disablepictureinpicture playsinline preload="metadata" aria-label="Video khẩu hình âm ${s[0]}"></video>
  <img src="img/${s[1]}.png" alt="Khẩu hình âm ${s[0]}"><div class="cap">${s[2].split(' · ').map(esc).join('<br>')}</div>
  <div class="words">${s[3].map(w=>`<div class="word">${pbtn(W(w),'sm')}${esc(w)}<span class="m">${MEAN[w]||''}</span></div>`).join('')}</div></div>`;
 const wordRow=w=>{const plain=w.replace(/\*/g,'');return `<div class="word">${pbtn(W(plain),'sm')}<span>${stress(w)}</span><span class="m">${MEAN[plain.toLowerCase()]||''}</span></div>`};
 V.innerHTML=`<div class="banner">IPA · 12 nguyên âm đơn</div>
  <p class="note">Xem video khẩu hình của từng âm, rồi bấm loa cạnh từng từ để nghe từ ví dụ.</p>
  <div class="pairs">${VOWELS.map(p=>`<div class="pair">${sndCard(p[0],p[0][0].includes('ː'))}${sndCard(p[1],p[1][0].includes('ː'))}</div>`).join('')}</div>
  <div class="banner">Trọng âm</div>
  <p class="note">Âm tiết được nhấn đọc to hơn, dài hơn, cao hơn. Trên trang, phần <b style="color:var(--rd)">VIẾT HOA màu đỏ</b> là âm tiết được nhấn.</p>
  <div class="rules">${RULES.map(r=>`<div class="rcard"><h3>${esc(r[0])}</h3><div class="words" style="display:flex;flex-direction:column;gap:6px">${r[1].map(wordRow).join('')}</div>${r[2]?`<div class="ex">${r[2].split(': ')[0]}: <span style="font-family:var(--serif);font-size:17px;color:var(--bl)">${r[2].split(': ')[1].split(', ').map(stress).join(', ')}</span></div>`:''}</div>`).join('')}</div>`;
 hydrateVideos();
}


/* Videos: load each file whole and play it from a blob URL, so phones (iOS Safari) that fail on partial (range) requests can still play it */
const VB={};
function hydrateVideos(){
 V.querySelectorAll('video[data-src]').forEach(v=>{
  const p=v.dataset.src;
  const set=u=>{v.src=u;v.addEventListener('loadedmetadata',()=>{try{if(v.currentTime<0.1)v.currentTime=0.6}catch(e){}},{once:true})};
  if(VB[p]){set(VB[p]);return}
  fetch(p).then(r=>{if(!r.ok)throw 0;return r.blob()}).then(b=>{VB[p]=URL.createObjectURL(new Blob([b],{type:'video/mp4'}));set(VB[p])}).catch(()=>set(p+'#t=0.6'));
 });
}
/* ---------- LUYỆN NGHE ---------- */
function renderListen(){
 const v=L.listen[voice]?voice:'f', src=L.listen[v][0], T=L.listen[v][1];
 V.innerHTML=stepsHTML()+`<div class="banner">Bài nghe</div><div class="center">
  <div class="seg" role="tablist"><button id="lt1" role="tab">Có văn bản</button><button id="lt2" role="tab">Chỉ nghe</button></div>
  ${L.dialog?'<p class="note">Bài này là hội thoại 2 giọng: A giọng nữ, B giọng nam.</p>':''}
  <button id="pb" aria-label="Phát hoặc tạm dừng">${PLAYI}</button>
  <div class="seek"><span id="cur">0:00</span><input id="sk" type="range" min="0" max="1000" value="0" aria-label="Tua audio"><span id="dur">0:00</span></div>
  <div class="speed" id="sp">${[0.5,0.75,1,1.25,1.5,2].map(r=>`<button data-r="${r}" class="${r===st.get('rate',1)?'on':''}">${r}x</button>`).join('')}</div>
  <div class="lines" id="LN">${L.lines.map(x=>'<div>'+x+'</div>').join('')}</div></div>`;
 const a=window.LA||(window.LA=new Audio());a.src=src;a.playbackRate=st.get('rate',1);
 const pb=$('pb'),sk=$('sk'),cur=$('cur'),dur=$('dur'),LN=$('LN');let drag=false;
 const fmt=t=>{t=Math.floor(t||0);return Math.floor(t/60)+':'+String(t%60).padStart(2,'0')};
 const paint=x=>sk.style.setProperty('--v',(x/10)+'%');
 const showText=s=>{LN.hidden=!s;$('lt1').setAttribute('aria-selected',s);$('lt2').setAttribute('aria-selected',!s);st.set('text',s)};
 $('lt1').onclick=()=>showText(true);$('lt2').onclick=()=>showText(false);showText(st.get('text',true));
 pb.onclick=()=>a.paused?a.play():a.pause();
 a.onplay=()=>pb.innerHTML=PAUSEI;a.onpause=()=>pb.innerHTML=PLAYI;
 a.onended=()=>{pb.innerHTML=PLAYI;[...LN.children].forEach(d=>d.classList.remove('on'))};
 a.onloadedmetadata=()=>dur.textContent=fmt(a.duration);
 sk.oninput=()=>{drag=true;paint(sk.value);cur.textContent=fmt(sk.value/1000*(a.duration||0))};
 sk.onchange=()=>{a.currentTime=sk.value/1000*(a.duration||0);drag=false};
 document.querySelectorAll('#sp button').forEach(x=>x.onclick=()=>{a.playbackRate=+x.dataset.r;st.set('rate',+x.dataset.r);document.querySelectorAll('#sp button').forEach(y=>y.classList.toggle('on',y===x))});
 a.ontimeupdate=()=>{if(!drag){const x=a.currentTime/(a.duration||1)*1000;sk.value=x;paint(x);cur.textContent=fmt(a.currentTime)}let k=-1;T.forEach((t,i)=>{if(a.currentTime>=t)k=i});[...LN.children].forEach((d,i)=>d.classList.toggle('on',i===k&&!a.paused))};
}

/* ---------- BÀI TẬP ---------- */
let QP=null,qi=0,res=[],only=null;
const norm=s=>s.toLowerCase().replace(/[’']/g,"'").replace(/[^a-z0-9' ]+/g,' ').trim().split(/\s+/).filter(Boolean);
function renderQuiz(){
 const best=st.get('best',{});
 V.innerHTML=`<div class="parts">${QUIZ.map(p=>`<button class="part ${QP&&QP.id===p.id?'on':''}" data-p="${p.id}"><b>${p.name}</b><span>10 câu${best[p.id]!=null?' · cao nhất '+best[p.id]+'/10':''}</span></button>`).join('')}</div><div id="QZ"></div>`;
 V.querySelectorAll('.part').forEach(b=>b.onclick=()=>{QP=QUIZ.find(p=>p.id===b.dataset.p);qi=0;res=[];only=null;renderQuiz()});
 if(!QP){$('QZ').innerHTML='<p class="soon">Chọn một phần để bắt đầu. Mỗi phần 10 câu: 7 câu theo bài học, 3 câu mở rộng.</p>';return}
 showQ();
}
function order(){return only||QP.qs.map((_,i)=>i)}
function showQ(){
 const ids=order(); if(qi>=ids.length)return showEnd();
 const q=QP.qs[ids[qi]], Z=$('QZ');
 let body='';
 if(q.type==='listen'||q.type==='choice') body=`${q.audio?`<div>${pbtn(q.audio)}</div>`:''}<div class="opts">${q.opts.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o)}</button>`).join('')}</div>`;
 if(q.type==='stress') body=`<div class="center"><div>${pbtn(W(q.w))}</div><div class="syl">${q.syl.map((s,i)=>`<button class="opt" data-i="${i}">${esc(s)}</button>`).join('')}</div><p class="note">${esc(q.w)} · ${MEAN[q.w.toLowerCase()]||{window:'cửa sổ',repeat:'nhắc lại',nineteen:'số 19'}[q.w]||''}</p></div>`;
 if(q.type==='dict') body=`<div>${pbtn(q.audio)}</div><form class="dict" id="DF"><input id="DI" autocomplete="off" placeholder="Gõ câu bạn nghe được" aria-label="Câu bạn nghe được"><button class="btn" type="submit">Kiểm tra</button></form>`;
 const qt=q.type==='stress'?'Bấm vào âm tiết được nhấn':q.type==='dict'?'Nghe và chép lại câu':q.q;
 Z.innerHTML=`<div class="q"><div class="prog"><span>Câu ${qi+1}/${ids.length}</span><div class="bar"><i style="width:${qi/ids.length*100}%"></i></div></div>
  <div class="qtop"><span class="pill ${q.ext?'ext':''}">${q.ext?'Mở rộng':'Trong bài'}</span></div><p class="qtext">${qt}</p>${body}<div id="FB"></div></div>`;
 Z.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(q,+b.dataset.i===q.a,b));
 if(q.type==='dict'){$('DF').onsubmit=e=>{e.preventDefault();const u=norm($('DI').value),r=norm(q.ans);answer(q,u.join(' ')===r.join(' '),null,u,r)};$('DI').focus()}
}
function answer(q,ok,btn,u,r){
 const Z=$('QZ');Z.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(+b.dataset.i===q.a)b.classList.add('good')});
 if(btn&&!ok)btn.classList.add('bad');
 if(q.type==='dict'){$('DI').disabled=true;Z.querySelector('#DF .btn').disabled=true}
 res.push({i:order()[qi],ok});
 let extra='';
 if(q.type==='dict'&&!ok){const set=new Set(r);extra=`<div>Bạn viết: ${u.length?u.map(w=>set.has(w)?esc(w):`<span class="wrong">${esc(w)}</span>`).join(' '):'(trống)'}</div><div>Đáp án: <span class="right">${esc(q.ans)}</span></div>`}
 $('FB').innerHTML=`<div class="fb ${ok?'good':'bad'}"><b class="h">${ok?'Chính xác!':'Chưa đúng'}</b>${extra}<div>${q.ex}</div></div><div class="rowbtn" style="margin-top:12px"><button class="btn" id="NX">${qi+1<order().length?'Câu tiếp':'Xem kết quả'}</button></div>`;
 $('NX').onclick=()=>{qi++;showQ()};$('NX').focus();
}
function showEnd(){
 const n=res.filter(x=>x.ok).length,tot=res.length,wrong=res.filter(x=>!x.ok).map(x=>x.i);
 if(!only){const best=st.get('best',{});best[QP.id]=Math.max(best[QP.id]||0,n);st.set('best',best)}
 $('QZ').innerHTML=`<div class="center"><div class="score">${n}/${tot}</div><p class="note">${n===tot?'Xuất sắc! Bạn làm đúng hết.':n>=tot*0.7?'Làm tốt! Xem lại các câu sai bên dưới.':'Ôn lại phần Ôn bài rồi làm lại nhé.'}</p>
  ${wrong.length?`<div class="review">${wrong.map(i=>{const q=QP.qs[i];return `<div><b>${q.type==='stress'?esc(q.w):q.type==='dict'?esc(q.ans):q.q}</b><br>${q.ex}</div>`}).join('')}</div>`:''}
  <div class="rowbtn" style="justify-content:center">${wrong.length?'<button class="btn" id="RW">Làm lại câu sai</button>':''}<button class="btn alt" id="RA">Làm lại từ đầu</button></div></div>`;
 if(wrong.length)$('RW').onclick=()=>{only=wrong;qi=0;res=[];showQ()};
 $('RA').onclick=()=>{only=null;qi=0;res=[];showQ()};
}
/*GUARD*/['contextmenu','copy','cut','dragstart'].forEach(ev=>document.addEventListener(ev,e=>{if(!e.target.closest('input,textarea'))e.preventDefault()}));
window.addEventListener('hashchange',route);route();
