function o4(a,pool){return shuf([a,...pick(pool.filter(x=>x!==a),3)])}
function stdGames(o){
 const IT=o.items, EN=[...new Set(IT.map(i=>i.en))], VN=[...new Set(IT.map(i=>i.vn))];
 const au=IT.filter(i=>HAS(i.k));
 const g1=au.length>=4?
  {id:'g1',ic:'👂',name:o.g1name||'Nghe chọn đúng',desc:o.g1desc||'Nghe Cô Lucy đọc, chọn đúng từ.',rules:['Nghe cô Lucy đọc (bấm loa để nghe lại).','Chọn đúng đáp án trong 4 lựa chọn.','10 câu · đúng liên tiếp để nhận combo.'],
   make:()=>{let L=shuf(au);while(L.length<10)L=L.concat(shuf(au));return L.slice(0,10).map(i=>({k:'mc',kind:'Cô đang đọc từ nào?',audio:i.k,opts:o4(i.en,EN),a:i.en,sym:1,ex:`<b>${i.en}</b> = ${i.vn}`}))}}
 :{id:'g1',ic:'🔎',name:o.g1name||'Nhìn chọn nghĩa',desc:'Nhìn tiếng Anh, chọn nghĩa tiếng Việt.',rules:['Mỗi câu hiện một từ tiếng Anh.','Chọn nghĩa tiếng Việt đúng.','10 câu · đúng liên tiếp để nhận combo.'],
   make:()=>{let L=shuf(IT);while(L.length<10)L=L.concat(shuf(IT));return L.slice(0,10).map(i=>({k:'mc',kind:'Từ này nghĩa là gì?',qhtml:`<b style="font-size:32px">${i.en}</b>`,opts:o4(i.vn,VN),a:i.vn,after:HAS(i.k)?i.k:undefined,ex:`<b>${i.en}</b> = ${i.vn}`}))}};
 const g2={id:'g2',ic:'VN',name:o.g2name||'Dịch nhanh Việt → Anh',desc:o.g2desc||'Nhìn tiếng Việt, chọn tiếng Anh đúng.',rules:['Mỗi câu hiện một từ/cụm tiếng Việt.','Chọn tiếng Anh tương ứng.','10 câu · chọn xong cô đọc lại cho bạn nghe.'],
   make:o.g2make||(()=>{let L=shuf(IT);while(L.length<10)L=L.concat(shuf(IT));return L.slice(0,10).map(i=>({k:'mc',kind:'Chọn tiếng Anh đúng',qhtml:`<b style="font-size:30px">${i.vn}</b>`,opts:o4(i.en,EN),a:i.en,sym:1,after:HAS(i.k)?i.k:undefined,ex:`${i.vn} → <b>${i.en}</b>`}))})};
 const g3={id:'g3',ic:'60',name:o.g3name||'Tốc độ 60 giây',desc:o.g3desc||'Chạm thật nhanh, phá kỷ lục của chính bạn!',timed:60,rules:o.g3rules||['Có 60 giây, câu hỏi hiện liên tục.','Chạm đáp án đúng thật nhanh.','Đúng +1 điểm, đúng 5 câu liên tiếp được +2. Phá kỷ lục của chính bạn!'],stars:o.stars||[10,18,26],
   next:o.g3next||(()=>{const i=IT[Math.random()*IT.length|0];const r=Math.random()<.5;return r?{k:'mc',kind:'Chọn tiếng Anh',qhtml:`<b style="font-size:30px">${i.vn}</b>`,opts:o4(i.en,EN),a:i.en,sym:1,ex:i.vn+' = '+i.en}:{k:'mc',kind:'Chọn nghĩa',qhtml:`<b style="font-size:30px">${i.en}</b>`,opts:o4(i.vn,VN),a:i.vn,ex:i.en+' = '+i.vn}})};
 return [o.g1||g1,o.g2||g2,o.g3||g3];
}
function itemCards(IT){return `<div class="rules">${IT.map(i=>`<div class="rcard"><div style="display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap"><h3 style="font-family:var(--sans)">${i.vn}</h3><button class="chip big"${sayAttr(i.k)}>${i.en}</button></div>${i.ipa?`<span class="exn">/${i.ipa}/</span>`:''}${i.ex?`<div class="chips" style="margin-top:8px"><button class="chip"${sayAttr(i.exk)}>${HAS(i.exk)?'▶ ':''}${i.ex}</button></div>${i.exvn?`<p class="note" style="margin:4px 0 0">${i.exvn}</p>`:''}`:''}</div>`).join('')}</div>`}
function allChip(IT,label){const ks=IT.map(i=>i.k).filter(HAS);return ks.length?`<div class="chips" style="margin-top:12px"><button class="chip" data-say="${ks.join(',')}">▶ ${label||'Nghe tất cả'}</button></div>`:''}
function tips(T){return `<div class="banner">Mẹo nhớ</div><div class="rules">${T.map(([h,p])=>`<div class="rcard"><h3>${h}</h3><p class="note" style="color:var(--ink)">${p}</p></div>`).join('')}</div>`}
const SPEC={"tag": "TIẾNG ANH TỪ SỐ 0 · BÀI 28", "title": "Số 13 – 99", "items": [["13", "thirteen"], ["14", "fourteen"], ["15", "fifteen"], ["16", "sixteen"], ["17", "seventeen"], ["18", "eighteen"], ["19", "nineteen"], ["30", "thirty"], ["40", "forty"], ["50", "fifty"], ["60", "sixty"], ["70", "seventy"], ["80", "eighty"], ["90", "ninety"], ["21", "twenty-one"], ["35", "thirty-five"], ["48", "forty-eight"], ["99", "ninety-nine"]], "fills": [["13 = ___", "thirteen", "Nhấn cuối: thirTEEN", ["thirty", "three", "fourteen"]], ["30 = ___", "thirty", "Nhấn đầu: THIRty", ["thirteen", "three", "forty"]], ["40 = ___", "forty", "Chú ý: không có chữ u!", ["fourty", "fourteen", "fifty"]], ["15 = ___", "fifteen", "", ["fifty", "fiveteen", "sixteen"]], ["21 = ___", "twenty-one", "", ["twelve-one", "twenty", "thirty-one"]], ["99 = ___", "ninety-nine", "", ["nineteen-nine", "nine-nine", "ninety"]]], "ext": [["18 = ___", "eighteen", "", ["eighty", "eightteen", "eight"]], ["65 = ___", "sixty-five", "", ["sixteen-five", "fifty-six", "sixty"]], ["50 = ___", "fifty", "", ["fifteen", "fivety", "five"]]], "tips": [["-teen (13–19)", "Nhấn âm cuối: thirTEEN, fourTEEN"], ["-ty (20–90)", "Nhấn âm đầu: THIRty, FORty"], ["Ghép số", "Nối bằng gạch ngang: twenty-one, ninety-nine"]], "intro": null, "groups": [["-teen", [0, 1, 2, 3, 4, 5, 6]], ["-ty", [7, 8, 9, 10, 11, 12, 13]], ["Ghép số", [14, 15, 16, 17]]], "vq": "Số <b>{vn}</b> đọc là:", "g2name": null};
// generic lesson from SPEC: {tag,title,items:[[vn,en]],fills:[[sent,ans,vn,pool]],ext:[[sent,ans,vn,pool]],tips:[[h,p]],intro,groups:[[name,[idx..]]]}
const IT=SPEC.items.map(([vn,en])=>({vn,en}));
const ENS=[...new Set(IT.map(i=>i.en))], VNS=[...new Set(IT.map(i=>i.vn))];
const F=SPEC.fills||[], FX=SPEC.ext||[];
const blankH=s=>s.replace('___','<span style="color:var(--or)">___</span>');
function fq(f,ext){const [s,a,vn,pool]=f;const o=[...new Set([a,...pick((pool||ENS).filter(x=>x!==a),3)])];return {type:'choice',ext:ext?1:undefined,q:blankH(s)+(vn?`<br><span style="color:var(--mu);font-size:15px">${vn}</span>`:''),opts:[a,...o.slice(1)],a:0,ex:`${s.replace('___','<b>'+a+'</b>')}${vn?' · '+vn:''}`}}
const VQT=SPEC.vq||'"{vn}" trong tiếng Anh là:';
function vq(i){const o=[i.en,...pick(ENS.filter(x=>x!==i.en),2)];return {type:'choice',q:VQT.replace('{vn}',i.vn),opts:o,a:0,ex:`${i.vn} = <b>${i.en}</b>`}}
const inq=[...pick(F,Math.min(4,F.length)).map(f=>fq(f)),...pick(IT,7).map(vq)].slice(0,7);
const exq=FX.length?pick(FX,3).map(f=>fq(f,1)):pick(IT.filter(i=>!inq.some(q=>q.ex&&q.ex.startsWith(i.vn+' ='))),3).map(i=>{const q=vq(i);q.ext=1;return q});
const QUIZ={name:SPEC.title,qs:[...inq,...exq].slice(0,10).map(q=>{const c=q.opts[q.a];const o=shuf(q.opts);return {...q,opts:o,a:o.indexOf(c)}})};
const ALLF=F.concat(FX);
const G2=ALLF.length>=4?{id:'g2',ic:'✎',name:SPEC.g2name||'Điền vào chỗ trống',desc:'Đọc câu, chọn từ đúng điền vào chỗ trống.',rules:['Mỗi câu có một chỗ trống và nghĩa tiếng Việt.','Chọn đáp án đúng.','10 câu.'],
  make:()=>{let L=shuf(ALLF);while(L.length<10)L=L.concat(shuf(ALLF));return L.slice(0,10).map(([s,a,vn,pool])=>({k:'mc',kind:'Chọn từ điền vào chỗ trống',qhtml:`<b style="font-size:24px">${blankH(s)}</b>${vn?`<br><span style="color:var(--mu);font-size:15px">${vn}</span>`:''}`,opts:shuf([...new Set([a,...pick((pool||ENS).filter(x=>x!==a),3)])]),a:a,sym:1,ex:s.replace('___','<b>'+a+'</b>')}))}}:undefined;
const G3=ALLF.length>=4?{id:'g3',ic:'60',name:'Tốc độ 60 giây',desc:'Trả lời thật nhanh, phá kỷ lục của chính bạn!',timed:60,rules:['Có 60 giây, câu hỏi hiện liên tục.','Chạm đáp án đúng thật nhanh.','Đúng +1 điểm, đúng 5 câu liên tiếp được +2.'],stars:[10,18,26],
  next:()=>{if(Math.random()<.5){const [s,a,vn,pool]=ALLF[Math.random()*ALLF.length|0];return {k:'mc',kind:'Điền nhanh',qhtml:`<b style="font-size:24px">${blankH(s)}</b>`,opts:shuf([...new Set([a,...pick((pool||ENS).filter(x=>x!==a),3)])]),a:a,sym:1,ex:s.replace('___',a)}}const i=IT[Math.random()*IT.length|0];return {k:'mc',kind:'Chọn tiếng Anh',qhtml:`<b style="font-size:28px">${i.vn}</b>`,opts:o4(i.en,ENS),a:i.en,sym:1,ex:i.vn+' = '+i.en}}}:undefined;
const P={tag:SPEC.tag,title:SPEC.title,qz:QUIZ,games:stdGames({items:IT,g1name:'Chọn nghĩa',g2:G2,g3:G3})};

const LINKS={};

/* =============== PROGRESS =============== */
let prog=st.get('prog',{});
function streak(){const today=new Date().toDateString();let s=st.get('streak',{d:'',n:0});
 if(s.d!==today){const y=new Date(Date.now()-864e5).toDateString();s={d:today,n:s.d===y?s.n+1:1};st.set('streak',s)}return s.n}
const totalStars=()=>P.games.reduce((a,g)=>a+((prog[g.id]||{}).stars||0),0);
const starsHTML=n=>'<div class="stars">'+[0,1,2].map(i=>`<i class="${i<n?'on':''}">★</i>`).join('')+'</div>';
const unlocked=i=>i===0||!!prog[P.games[i-1].id];

/* =============== VIEWS =============== */
const app=document.getElementById('APP');
function topbar(){return `<div class="top"><div class="brand"><img src="img/lec.png" alt="LEC"><b>CÔ LUCY · TỪ A0 → B2</b></div>
 <div style="display:flex;gap:8px;align-items:center"><button class="mute" id="MU" aria-label="Âm hiệu ứng">${muted?'🔇':'🔔'}</button></div></div>`}
function bindTop(){const m=document.getElementById('MU');if(m)m.onclick=()=>{muted=!muted;st.set('mute',muted);m.textContent=muted?'🔇':'🔔'}}
const TABS=[['on','Ôn bài'],['kiem-tra','Kiểm tra'],['game','Game']];
let tab=(()=>{const x=(location.hash||'').slice(1);return TABS.some(t=>t[0]===x)?x:st.get('tab','on')})();
window.addEventListener('hashchange',()=>{const x=location.hash.slice(1);if(TABS.some(t=>t[0]===x)&&x!==tab){tab=x;if(G)G.done=true,clearInterval(G.tick);home()}});
function reviewHTML(){
 const grp=SPEC.groups||[[null,IT.map((_,i)=>i)]];
 const cards=grp.map(([g,ix])=>`<div class="rcard">${g?`<h3>${g}</h3>`:''}<div class="chips">${ix.map(i=>`<span class="chip">${IT[i].vn} · <b>${IT[i].en}</b></span>`).join('')}</div></div>`).join('');
 const ex=F.length?`<div class="banner">Câu mẫu</div><div class="rules">${F.slice(0,6).map(([s,a,vn])=>`<div class="rcard"><h3 style="font-family:var(--sans);font-size:20px">${s.replace('___','<span style="color:var(--or)">'+a+'</span>')}</h3>${vn?`<p class="note" style="margin:4px 0 0">${vn}</p>`:''}</div>`).join('')}</div>`:'';
 return `<div class="banner">${SPEC.title}</div>${SPEC.intro?`<p class="note">${SPEC.intro}</p>`:''}<div class="rules">${cards}</div>${ex}${SPEC.tips?tips(SPEC.tips):''}`}

function bindReview(){}
function home(){
 stopSay();st.set('tab',tab);if(location.hash.slice(1)!==tab)history.replaceState(null,'','#'+tab);
 const xp=st.get('xp',0),sk=streak(),ts=totalStars(),all=P.games.every(g=>prog[g.id]);
 const tb=st.get('test',null);
 let body='';
 if(tab==='on')body=reviewHTML()+`<div class="cta"><p>Ôn xong rồi? Làm bài kiểm tra 10 câu nhé.</p><button class="btn or" data-tab="kiem-tra">Làm bài kiểm tra →</button></div>`;
 if(tab==='kiem-tra')body=`<div class="tcard"><span class="qk">KIỂM TRA · ${P.qz.name.toUpperCase()}</span><div class="big" style="font-size:34px">10 câu</div><p class="sub">7 câu theo bài học, 3 câu mở rộng. Đúng từ 8/10 là bạn đã nắm vững bài này.</p>${tb!=null?`<p class="sub"><b style="color:var(--pu)">Điểm cao nhất: ${tb}/10</b></p>`:''}<button class="btn or" id="TS">${tb!=null?'Làm lại bài kiểm tra':'Bắt đầu kiểm tra'}</button></div>`;
 if(tab==='game')body=`<div class="stats"><div class="stat"><b>${xp}</b><span>XP</span></div><div class="stat"><b>🔥 ${sk}</b><span>NGÀY LIÊN TIẾP</span></div><div class="stat"><b>${ts}/9</b><span>SAO</span></div></div>
 <div class="games">${P.games.map((g,i)=>{const pg=prog[g.id],lk=!unlocked(i);return `<button class="gc ${lk?'lock':''}" data-g="${i}" ${lk?'aria-disabled="true"':''}><span class="ic">${lk?'🔒':g.ic}</span><span class="tx"><small>GAME ${i+1}${g.timed?' · TÍNH GIỜ':''}</small><b>${g.name}</b><span>${lk?'Hoàn thành game '+i+' để mở khóa':g.desc}</span></span><span class="st">${starsHTML(pg?pg.stars:0)}${pg&&g.timed?`<span class="best">Kỷ lục: ${pg.best}</span>`:''}</span></button>`}).join('')}</div>
 ${all?`<div class="done"><b>${ts===9?'🏆 Xuất sắc! 9/9 sao':'🎉 Đã hoàn thành 3 game'}</b><p>${ts===9?'Từ 13 đến 99, bạn đọc chuẩn trọng âm!':'Chơi lại để gom đủ 9 sao nhé!'} Học tiếp <b>Bài 29 · Chào Hỏi & Câu Lịch Sự</b> cùng Cô Lucy nhé.</p><a class="btn or" style="text-decoration:none;display:block" href="../bai-29/">Sang Bài 29 →</a></div>`:''}
 <p class="foot">Tiến độ được lưu trên trình duyệt của thiết bị này.</p>`;
 app.innerHTML=topbar()+`<div class="hero"><span class="tag">${P.tag}</span><h1>${P.title}</h1><div class="rule"></div></div>
 <div class="tabs" role="tablist">${TABS.map(t=>`<button role="tab" data-tab="${t[0]}" aria-selected="${t[0]===tab}">${t[1]}</button>`).join('')}</div>`+body;
 bindTop();
 app.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;home()});
 app.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{const i=+b.dataset.g;if(unlocked(i))intro(i)});
 app.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>say(b.dataset.say));
 const ts_=document.getElementById('TS');if(ts_)ts_.onclick=()=>{AC=AC||new (window.AudioContext||window.webkitAudioContext||function(){})();play(-1)};
 if(tab==='on')bindReview();
 window.scrollTo(0,0);
}
function intro(i){const g=P.games[i];
 app.innerHTML=topbar()+`<div class="card intro"><span class="qk">GAME ${i+1} / 3</span><div class="big" style="font-size:36px">${g.name}</div><ul>${g.rules.map(r=>`<li>${r}</li>`).join('')}</ul><button class="btn or" id="GO">Bắt đầu</button><button class="btn ghost" id="BK">Quay lại</button></div>`;
 bindTop();document.getElementById('GO').onclick=()=>{AC=AC||new (window.AudioContext||window.webkitAudioContext||function(){})();play(i)};document.getElementById('BK').onclick=home;window.scrollTo(0,0)}
function testQs(){return P.qz.qs.map(q=>({k:'mc',qhtml:q.q,audio:q.audio,opts:shuf(q.opts),a:q.opts[q.a],ext:q.ext,ex:q.ex,sym:q.opts[0].length<=2,one:q.opts.some(x=>x.length>9),kind:q.type==='listen'?'Nghe':'Chọn đáp án'}))}
/* =============== GAME ENGINE =============== */
let G;
function play(i){const test=i<0;const g=test?{name:'Kiểm tra',test:1,make:testQs}:P.games[i];G={i,g,test,n:0,ok:0,score:0,combo:0,maxc:0,xp:0,qs:g.timed?null:g.make(),t0:Date.now(),end:g.timed?Date.now()+g.timed*1000:0,lock:false,done:false};
 if(g.timed){G.tick=setInterval(()=>{const left=Math.max(0,G.end-Date.now());const b=document.getElementById('TBAR');if(b)b.style.width=(left/(g.timed*10))+'%';const tt=document.getElementById('TT');if(tt)tt.textContent=Math.ceil(left/1000)+'s';if(left<=0){clearInterval(G.tick);finish()}},200)}
 nextQ()}
function shell(inner,progress){const g=G.g;
 return `<div class="gbar"><button class="x" id="QX" aria-label="Thoát">✕</button><div class="prog ${g.timed?'timer':''}"><i id="TBAR" style="width:${g.timed?Math.max(0,(G.end-Date.now())/(g.timed*10)):progress}%"></i></div>${g.timed?'<span class="timebig" id="TT"></span>':''}<span class="combo" id="CB">${g.timed?'⭐ '+G.score:g.test?'✓ '+G.ok:'🔥 x'+G.combo}</span></div><div class="card" id="CARD">${inner}</div><div id="FB"></div>`}
function nextQ(){if(G.done)return;const g=G.g;let q;
 if(g.timed)q=g.next();else{if(G.n>=G.qs.length)return finish();q=G.qs[G.n]}
 G.q=q;G.lock=false;G.hinted=false;
 const pct=g.timed?0:G.n/G.qs.length*100;
 let h=`<span class="qk">${g.timed?'':'Câu '+(G.n+1)+' / '+G.qs.length+' · '}${q.kind||({stress:'Âm tiết nào được nhấn?',tap:'Chạm các từ được nhấn',order:'Xếp lại câu bạn nghe',type:'Nghe và gõ lại email'}[q.k])}</span>`;
 if(q.qhtml)h+=`<p class="qt">${q.qhtml}</p>`;
 if(G.test)h=h.replace('<span class="qk">',`<span class="qk">${q.ext?'MỞ RỘNG · ':'TRONG BÀI · '}`);
 if(q.img)h+=`<img class="mouth" src="${q.img}" alt="Khẩu hình">`;
 if(q.word)h+=`<div class="big seq">${esc(q.word)}</div>`;
 if(q.audio)h+=`<button class="hearbig ${q.word||q.img?'sm':''}" id="HEAR" aria-label="Nghe">${SPK}</button>`;
 if(q.k==='mc'){h+=`<div class="opts ${q.one?'one':''}">${q.opts.map((o,j)=>`<button class="opt ${q.sym?'sym':''}" data-o="${j}">${esc(o)}${q.ipa?`<span class="ipa">/${IPA[o]}/</span>`:''}</button>`).join('')}</div>`}
 if(q.k==='stress')h+=`<div class="syls">${q.syl.map((s,j)=>`<button class="syl" data-o="${j}">${s}</button>`).join('')}</div>`;
 if(q.k==='tap')h+=`<div class="toks">${q.t.map((w,j)=>`<button class="tok" data-t="${j}">${esc(w)}</button>`).join('')}</div><button class="btn" id="CHK">Kiểm tra</button>`;
 if(q.k==='order'){q.pool=shuf(q.t.map((w,j)=>j));q.pick=[];h+=`<div class="slot" id="SL"></div><div class="toks" id="PL">${q.pool.map(j=>`<button class="tok" data-p="${j}">${esc(q.t[j])}</button>`).join('')}</div><button class="btn" id="CHK" disabled>Kiểm tra</button>`}
 if(q.k==='type')h+=`<input class="inp" id="IN" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Gõ lại email bạn nghe…"><div class="hint" id="HT"></div><div class="row2"><button class="btn ghost" id="HINT">Gợi ý</button><button class="btn" id="CHK">Kiểm tra</button></div>`;
 app.innerHTML=topbar()+shell(h,pct);bindTop();
 document.getElementById('QX').onclick=()=>{clearInterval(G.tick);G.done=true;sfx.pause();tab=G.test?'kiem-tra':'game';home()};
 const hb=document.getElementById('HEAR');if(hb){hb.onclick=()=>{say(q.audio);G.replays=(G.replays||0)+1};if(!q.qhtml||q.kind==='Nghe')setTimeout(()=>say(q.audio),g.timed?30:120)}
 app.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>answerChoice(+b.dataset.o,b));
 if(q.k==='tap'){app.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{if(!G.lock)b.classList.toggle('on')});document.getElementById('CHK').onclick=checkTap}
 if(q.k==='order'){bindOrder()}
 if(q.k==='type'){const inp=document.getElementById('IN');inp.onkeydown=e=>{if(e.key==='Enter')checkType()};document.getElementById('CHK').onclick=checkType;
  document.getElementById('HINT').onclick=()=>{G.hinted=true;document.getElementById('HT').textContent=toks(q.ans).map(w=>w[0]+'_'.repeat(Math.max(0,clean(w).length-1))).join('  ')}}
 const tt=document.getElementById('TT');if(tt)tt.textContent=Math.ceil(Math.max(0,G.end-Date.now())/1000)+'s';
}
function bindOrder(){const q=G.q;const sl=document.getElementById('SL'),pl=document.getElementById('PL'),chk=document.getElementById('CHK');
 const draw=()=>{sl.innerHTML=q.pick.map((j,k)=>`<button class="tok on" data-u="${k}">${esc(q.t[j])}</button>`).join('');pl.querySelectorAll('[data-p]').forEach(b=>b.classList.toggle('used',q.pick.includes(+b.dataset.p)));chk.disabled=q.pick.length!==q.t.length;
  sl.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{if(G.lock)return;q.pick.splice(+b.dataset.u,1);draw()})};
 pl.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{if(G.lock)return;const j=+b.dataset.p;if(!q.pick.includes(j)){q.pick.push(j);draw()}});
 chk.onclick=()=>{if(G.lock)return;const ok=q.pick.map(j=>clean(q.t[j])).join(' ')===q.t.map(clean).join(' ');
  sl.querySelectorAll('.tok').forEach((b,k)=>{b.classList.remove('on');b.classList.add(clean(q.t[q.pick[k]])===clean(q.t[k])?'ok':'no')});
  result(ok,ok?q.ex:`Câu đúng: <b>${esc(q.full)}</b><br>${q.ex}`)};
 draw()}
function answerChoice(j,btn){if(G.lock)return;const q=G.q;const ok=q.k==='mc'?q.opts[j]===q.a:j===q.a;
 if(q.k==='mc'){app.querySelectorAll('[data-o]').forEach((b,k)=>{if(q.opts[k]===q.a)b.classList.add('ok')});if(!ok)btn.classList.add('no')}
 else{app.querySelectorAll('[data-o]').forEach((b,k)=>{if(k===q.a)b.classList.add('ok')});if(!ok)btn.classList.add('no')}
 result(ok,q.ex)}
function checkTap(){if(G.lock)return;const q=G.q;const sel=[...app.querySelectorAll('[data-t]')].filter(b=>b.classList.contains('on')).map(b=>+b.dataset.t);
 const ok=sel.length===q.a.length&&q.a.every(x=>sel.includes(x));
 app.querySelectorAll('[data-t]').forEach(b=>{const k=+b.dataset.t,on=sel.includes(k),need=q.a.includes(k);b.classList.remove('on');if(need&&on)b.classList.add('ok');else if(need)b.classList.add('miss');else if(on)b.classList.add('no')});
 result(ok,q.ex+(ok?'':' <br><span style="color:var(--or)">Khung cam nét đứt</span> = từ bạn bỏ sót.'))}
function checkType(){if(G.lock)return;const q=G.q;const inp=document.getElementById('IN');const ga=toks(q.ans).map(clean),gu=inp.value.trim().split(/\s+/).map(clean).filter(Boolean);
 const exp=x=>x.flatMap(w=>w==="i'm"?['i','am']:[w]);const A=exp(ga),U=exp(gu);let hit=0;const used=new Set();
 A.forEach(w=>{const k=U.findIndex((u,i)=>u===w&&!used.has(i));if(k>=0){used.add(k);hit++}});
 const acc=hit/A.length;q.acc=G.hinted?acc*0.7:acc;const ok=acc===1&&U.length===A.length;inp.disabled=true;
 result(ok,`${ok?'':'Bạn đúng '+hit+'/'+A.length+' từ. '}Câu đúng: <b>${esc(q.ans)}</b><br>${q.ex}`,ok?null:q.acc)}
function result(ok,ex,partial){G.lock=true;const g=G.g;tone(ok);if(G.q&&G.q.after){const af=G.q.after,qq=G.q;setTimeout(()=>{if(G.q===qq)say(af)},350)}
 if(ok){G.combo++;G.ok++;G.maxc=Math.max(G.maxc,G.combo);const bonus=G.combo>=3?5:0;const gain=10+bonus;G.xp+=gain;if(g.timed)G.score+=1+(G.combo>=5?1:0)}
 else{G.combo=0;if(partial)G.ok+=partial;if(partial)G.xp+=Math.round(10*partial)}
 const cb=document.getElementById('CB');if(cb){cb.textContent=g.timed?'⭐ '+G.score:g.test?'✓ '+Math.floor(G.ok):'🔥 x'+G.combo;if(ok&&G.combo>=2){cb.classList.remove('hot');void cb.offsetWidth;cb.classList.add('hot')}}
 if(G.test&&!ok)(G.wrong=G.wrong||[]).push(G.q);G.n++;
 if(g.timed){const f=document.createElement('div');f.className='flash'+(ok?'':' no');f.textContent=ok?(G.combo>=5?'+2 🔥':'+1'):'✗ '+G.q.a;document.body.appendChild(f);setTimeout(()=>f.remove(),800);setTimeout(()=>{if(Date.now()<G.end)nextQ()},ok?420:900);return}
 const fb=document.getElementById('FB');
 const praise=['Chính xác!','Tuyệt vời!','Chuẩn luôn!','Giỏi quá!','Rất tốt!'];
 fb.innerHTML=`<div class="fb ${ok?'ok':'no'}"><b>${ok?praise[Math.random()*praise.length|0]+(G.combo>=3&&!G.test?' 🔥 Combo x'+G.combo+' (+5 XP)':''):(partial!=null&&partial>0?'Gần đúng rồi!':'Chưa đúng')}</b><p>${ex}</p><button class="btn ${ok?'':'or'}" id="NX">${G.n>=G.qs.length?'Xem kết quả':'Tiếp tục'}</button></div>`;
 document.getElementById('NX').onclick=nextQ;document.getElementById('NX').focus({preventScroll:true});fb.scrollIntoView({behavior:'smooth',block:'nearest'})}
function finish(){if(G.done)return;G.done=true;clearInterval(G.tick);const g=G.g;if(G.test)return finishTest();
 let stars,main,label;
 if(g.timed){main=G.score;label='ĐIỂM';stars=G.score>=g.stars[2]?3:G.score>=g.stars[1]?2:G.score>=g.stars[0]?1:0}
 else{const acc=G.ok/G.qs.length;main=Math.round(acc*100)+'%';label='CHÍNH XÁC';stars=acc>=0.999?3:acc>=0.8?2:acc>=0.6?1:0}
 const old=prog[G.g.id]||{stars:0,best:0};const best=g.timed?Math.max(old.best||0,G.score):0;const nb=g.timed&&G.score>(old.best||0)&&old.best>0;
 if(stars>0||g.timed&&prog[g.id]){prog[g.id]={stars:Math.max(old.stars,stars),best}}else if(!prog[g.id]&&stars===0){/* chưa qua */}
 st.set('prog',prog);const xp=st.get('xp',0)+G.xp;st.set('xp',xp);streak();
 const nextI=G.i+1<P.games.length&&unlocked(G.i+1)?G.i+1:-1;
 const msg=stars===3?'Hoàn hảo! Bạn đã nắm chắc phần này.':stars===2?'Rất tốt! Chơi lại để lấy đủ 3 sao nhé.':stars===1?'Đạt rồi! Luyện thêm để lên 2–3 sao.':(g.timed?'Cần thêm điểm để đạt sao. Thử lại nào!':'Cần đúng ít nhất 60% để qua game. Thử lại nhé!');
 app.innerHTML=topbar()+`<div class="card res"><span class="qk">${g.name}</span>${starsHTML(stars)}<div class="big" style="font-size:30px">${msg}</div>${nb?'<div class="newbest">🏅 Kỷ lục mới!</div>':''}
 <div class="rgrid"><div><b>${main}</b><span>${label}</span></div><div><b>+${G.xp}</b><span>XP</span></div><div><b>${G.maxc}</b><span>COMBO MAX</span></div></div>
 ${g.timed?`<p class="sub">Mốc sao: ${g.stars.join(' · ')} điểm · Kỷ lục của bạn: ${best}</p>`:''}
 ${nextI>=0?`<button class="btn or" id="NG">Game tiếp theo →</button>`:''}<div class="row2"><button class="btn ghost" id="RP">Chơi lại</button><button class="btn ghost" id="HM">Trang chính</button></div></div>`;
 bindTop();if(stars>=2)tone(true);
 document.getElementById('RP').onclick=()=>play(G.i);document.getElementById('HM').onclick=()=>{tab='game';home()};const ng=document.getElementById('NG');if(ng)ng.onclick=()=>intro(nextI);window.scrollTo(0,0)}
function finishTest(){const n=Math.floor(G.ok+1e-9),tot=G.qs.length;const old=st.get('test',null);st.set('test',Math.max(old||0,n));const xp=st.get('xp',0)+G.xp;st.set('xp',xp);streak();
 const pass=n>=8;const qdesc=q=>q.qhtml?(q.kind==='Nghe'?'Câu nghe · đáp án đúng: <b>'+esc(q.a)+'</b>':q.qhtml):(q.k==='stress'?'Trọng âm: '+q.w:q.k==='type'?'Chép: '+esc(q.ans):'');
 app.innerHTML=topbar()+`<div class="card res"><span class="qk">KẾT QUẢ KIỂM TRA</span><div class="big" style="font-size:64px">${n}/${tot}</div><div class="big" style="font-size:26px">${pass?'Bạn đã nắm vững phần này! 🎉':'Ôn lại một chút rồi làm lại nhé!'}</div>
 ${G.wrong&&G.wrong.length?`<div class="wrongs"><b style="color:var(--rd)">Câu cần xem lại:</b>${G.wrong.map(q=>`<div>${qdesc(q)}<br><span style="color:var(--mu)">${q.ex}</span></div>`).join('')}</div>`:''}
 <button class="btn or" id="NG">${pass?'Chơi game ôn tập →':'Xem lại bài ôn'}</button><div class="row2"><button class="btn ghost" id="RP">Làm lại</button><button class="btn ghost" id="HM">Trang chính</button></div></div>`;
 bindTop();tone(pass);document.getElementById('RP').onclick=()=>play(-1);document.getElementById('HM').onclick=()=>{tab='kiem-tra';home()};document.getElementById('NG').onclick=()=>{tab=pass?'game':'on';home()};window.scrollTo(0,0)}
home();
</script>
</body></html>
